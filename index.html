<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NitinStudio — PDF Page Organizer</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>
:root {
  --primary:#4f46e5;
  --primary-dark:#3730a3;
  --accent:#06b6d4;
  --danger:#ef4444;
  --success:#10b981;
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --border:#e5e7eb;
}

* { box-sizing:border-box; font-family:"Segoe UI", Arial, sans-serif; }

body {
  margin:0;
  background:
    radial-gradient(circle at 10% 10%, #e0e7ff 0, transparent 45%),
    radial-gradient(circle at 90% 0%, #cffafe 0, transparent 40%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:18px;
}

.container {
  max-width:1150px;
  margin:auto;
}

/* Header */
.brand-header {
  background:linear-gradient(120deg,#4f46e5,#7c3aed 55%,#06b6d4);
  color:#fff;
  border-radius:18px;
  padding:22px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  box-shadow:0 12px 30px rgba(79,70,229,.25);
  flex-wrap:wrap;
}

.brand-left {
  display:flex;
  align-items:center;
  gap:14px;
}

.logo {
  width:52px;
  height:52px;
  border-radius:15px;
  background:rgba(255,255,255,.16);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  border:1px solid rgba(255,255,255,.35);
}

.brand-name {
  font-size:24px;
  font-weight:800;
  letter-spacing:.3px;
}

.brand-sub {
  font-size:13px;
  opacity:.9;
  margin-top:2px;
}

.header-tag {
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.35);
  padding:8px 14px;
  border-radius:999px;
  font-size:13px;
  font-weight:600;
}

/* Main card */
.card {
  background:var(--card);
  border-radius:18px;
  padding:20px;
  margin-top:18px;
  box-shadow:0 10px 30px rgba(15,23,42,.08);
  border:1px solid var(--border);
}

.toolbar {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
}

.btn {
  border:none;
  border-radius:10px;
  padding:11px 16px;
  font-size:14px;
  font-weight:600;
  color:#fff;
  cursor:pointer;
  transition:.18s ease;
  display:inline-flex;
  align-items:center;
  gap:7px;
}

.btn:hover:not(:disabled) {
  transform:translateY(-1px);
  box-shadow:0 6px 16px rgba(0,0,0,.15);
}

.btn:disabled {
  opacity:.55;
  cursor:not-allowed;
  transform:none;
  box-shadow:none;
}

.btn-primary { background:linear-gradient(135deg,#4f46e5,#6366f1); }
.btn-teal { background:linear-gradient(135deg,#0d9488,#14b8a6); }
.btn-purple { background:linear-gradient(135deg,#7c3aed,#a855f7); }
.btn-orange { background:linear-gradient(135deg,#ea580c,#f97316); }
.btn-red { background:linear-gradient(135deg,#dc2626,#ef4444); }

.status {
  margin-top:14px;
  text-align:center;
  font-size:14px;
  font-weight:600;
  color:var(--muted);
  background:#f8fafc;
  border:1px dashed var(--border);
  border-radius:10px;
  padding:10px;
}

/* Pages */
.pages {
  display:flex;
  flex-wrap:wrap;
  gap:16px;
  justify-content:center;
  margin-top:20px;
  min-height:180px;
}

.page-box {
  width:175px;
  background:#fff;
  border:2px solid var(--border);
  border-radius:14px;
  padding:9px;
  position:relative;
  cursor:grab;
  transition:.18s ease;
  box-shadow:0 4px 12px rgba(15,23,42,.06);
}

.page-box:hover {
  border-color:var(--primary);
  transform:translateY(-3px);
  box-shadow:0 10px 22px rgba(79,70,229,.15);
}

.page-box:active { cursor:grabbing; }

.page-box img {
  width:100%;
  height:215px;
  object-fit:contain;
  background:#f8fafc;
  border-radius:9px;
  border:1px solid #eef2f7;
  pointer-events:none;
}

.page-meta {
  margin-top:7px;
  text-align:center;
}

.page-num {
  font-size:13px;
  font-weight:700;
  color:var(--primary-dark);
}

.page-size {
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.delete-btn {
  position:absolute;
  top:6px;
  right:6px;
  width:27px;
  height:27px;
  border:none;
  border-radius:50%;
  background:var(--danger);
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  line-height:1;
  box-shadow:0 3px 8px rgba(239,68,68,.35);
}

.delete-btn:hover {
  background:#b91c1c;
  transform:scale(1.08);
}

.empty-state {
  width:100%;
  text-align:center;
  padding:45px 15px;
  color:var(--muted);
  background:#f8fafc;
  border:2px dashed #cbd5e1;
  border-radius:16px;
}

.empty-icon { font-size:38px; }
.empty-title { font-weight:700; margin-top:8px; color:#374151; }
.empty-text { font-size:13px; margin-top:4px; }

.ghost {
  opacity:.35;
  transform:scale(.97);
}

.footer {
  text-align:center;
  margin-top:18px;
  font-size:12px;
  color:var(--muted);
}

.footer b { color:var(--primary-dark); }

@media (max-width:600px) {
  .brand-header { justify-content:center; text-align:center; }
  .brand-left { justify-content:center; }
  .page-box { width:46%; }
  .page-box img { height:170px; }
}
</style>
</head>
<body>

<div class="container">

  <header class="brand-header">
    <div class="brand-left">
      <div class="logo">📄</div>
      <div>
        <div class="brand-name">NitinStudio</div>
        <div class="brand-sub">PDF Page Organizer — Drag, Delete & Add Pages</div>
      </div>
    </div>

    <div class="header-tag">⚡ Fast • Private • Browser Based</div>
  </header>

  <main class="card">
    <div class="toolbar">
      <button class="btn btn-primary" id="openPdf">📂 Open PDF</button>
      <button class="btn btn-teal" id="addPdf" disabled>➕ Add PDF Pages</button>
      <button class="btn btn-purple" id="addImg" disabled>🖼️ Add JPG / PNG</button>
      <button class="btn btn-orange" id="savePdf" disabled>💾 Save PDF</button>
      <button class="btn btn-red" id="clearAll" disabled>🗑️ Clear All</button>

      <input type="file" id="pdfInput" accept="application/pdf" hidden>
      <input type="file" id="imgInput" accept="image/jpeg,image/png" hidden>
    </div>

    <div class="status" id="status">
      PDF open करें। Pages को drag करके order बदलें, × से delete करें।
    </div>

    <div class="pages" id="pages">
      <div class="empty-state">
        <div class="empty-icon">🗂️</div>
        <div class="empty-title">कोई PDF page load नहीं है</div>
        <div class="empty-text">ऊपर <b>Open PDF</b> दबाकर अपनी PDF चुनें।</div>
      </div>
    </div>
  </main>

  <div class="footer">
    Made with ❤️ by <b>NitinStudio</b> • आपकी PDF आपके browser में ही process होती है
  </div>

</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const pagesEl = document.getElementById('pages');
const statusEl = document.getElementById('status');
const pdfInput = document.getElementById('pdfInput');
const imgInput = document.getElementById('imgInput');

const openBtn = document.getElementById('openPdf');
const addPdfBtn = document.getElementById('addPdf');
const addImgBtn = document.getElementById('addImg');
const saveBtn = document.getElementById('savePdf');
const clearBtn = document.getElementById('clearAll');

let items = [];

new Sortable(pagesEl, {
  animation: 180,
  ghostClass: 'ghost',
  onEnd: syncOrderFromDOM
});

function setStatus(msg) {
  statusEl.textContent = msg;
}

function enableButtons() {
  const has = items.length > 0;
  addPdfBtn.disabled = false;
  addImgBtn.disabled = false;
  saveBtn.disabled = !has;
  clearBtn.disabled = !has;
}

function renderPages() {
  pagesEl.innerHTML = '';

  if (!items.length) {
    pagesEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🗂️</div>
        <div class="empty-title">कोई PDF page load नहीं है</div>
        <div class="empty-text">ऊपर <b>Open PDF</b> दबाकर अपनी PDF चुनें।</div>
      </div>`;
    enableButtons();
    return;
  }

  items.forEach((item, i) => {
    const box = document.createElement('div');
    box.className = 'page-box';
    box.dataset.index = i;

    const img = document.createElement('img');
    img.src = item.thumb;

    const meta = document.createElement('div');
    meta.className = 'page-meta';

    const num = document.createElement('div');
    num.className = 'page-num';
    num.textContent = 'Page ' + (i + 1);

    const size = document.createElement('div');
    size.className = 'page-size';
    size.textContent = item.type === 'pdf'
      ? `PDF • ${item.w.toFixed(0)} × ${item.h.toFixed(0)} pt`
      : `Image • ${item.w.toFixed(0)} × ${item.h.toFixed(0)} pt`;

    const del = document.createElement('button');
    del.className = 'delete-btn';
    del.textContent = '×';
    del.title = 'Delete page';
    del.onclick = (e) => {
      e.stopPropagation();
      items.splice(i, 1);
      renderPages();
      setStatus('Page deleted successfully.');
    };

    meta.append(num, size);
    box.append(del, img, meta);
    pagesEl.appendChild(box);
  });

  enableButtons();
}

function syncOrderFromDOM() {
  const boxes = [...pagesEl.querySelectorAll('.page-box')];
  const arranged = [];

  boxes.forEach(box => {
    const idx = Number(box.dataset.index);
    if (items[idx]) arranged.push(items[idx]);
  });

  items = arranged;
  renderPages();
  setStatus('✅ Page order updated.');
}

async function makeThumb(page) {
  const base = page.getViewport({ scale: 1 });
  const scale = 320 / base.width;
  const viewport = page.getViewport({ scale });

  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;

  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;

  return canvas.toDataURL('image/jpeg', 0.85);
}

async function loadPdf(file, replace) {
  try {
    setStatus('⏳ PDF processing...');

    const bytes = await file.arrayBuffer();
    const jsDoc = await pdfjsLib.getDocument({ data: bytes.slice(0) }).promise;

    const loaded = [];

    for (let i = 0; i < jsDoc.numPages; i++) {
      const page = await jsDoc.getPage(i + 1);
      const vp = page.getViewport({ scale: 1 });
      const thumb = await makeThumb(page);

      loaded.push({
        type: 'pdf',
        bytes: bytes.slice(0),
        pageIndex: i,
        thumb,
        w: vp.width,
        h: vp.height
      });
    }

    items = replace ? loaded : items.concat(loaded);
    renderPages();

    setStatus(`✅ ${loaded.length} page(s) ${replace ? 'opened' : 'added'} successfully.`);
  } catch (err) {
    console.error(err);
    setStatus('❌ PDF file read नहीं हो पाई।');
  }
}

openBtn.onclick = () => {
  pdfInput.onchange = async () => {
    const f = pdfInput.files[0];
    if (f) await loadPdf(f, true);
    pdfInput.value = '';
  };
  pdfInput.click();
};

addPdfBtn.onclick = () => {
  pdfInput.onchange = async () => {
    const f = pdfInput.files[0];
    if (f) await loadPdf(f, false);
    pdfInput.value = '';
  };
  pdfInput.click();
};

addImgBtn.onclick = () => {
  imgInput.onchange = async () => {
    const file = imgInput.files[0];
    if (!file) return;

    try {
      setStatus('⏳ Image adding...');

      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      const img = new Image();
      img.src = dataUrl;
      await img.decode();

      items.push({
        type: 'image',
        dataUrl,
        thumb: dataUrl,
        w: 595.28,
        h: 841.89,
        imgW: img.width,
        imgH: img.height
      });

      renderPages();
      setStatus('✅ Image page added.');
    } catch (err) {
      console.error(err);
      setStatus('❌ Image add नहीं हो पाई।');
    }

    imgInput.value = '';
  };
  imgInput.click();
};

clearBtn.onclick = () => {
  if (!confirm('क्या सभी pages हटाने हैं?')) return;
  items = [];
  renderPages();
  setStatus('सभी pages clear कर दिए गए।');
};

saveBtn.onclick = async () => {
  if (!items.length) return;

  try {
    saveBtn.disabled = true;
    setStatus('⏳ NitinStudio PDF बना रहा है...');

    const out = await PDFLib.PDFDocument.create();

    for (const item of items) {
      if (item.type === 'pdf') {
        const src = await PDFLib.PDFDocument.load(item.bytes.slice(0));
        const [copied] = await out.copyPages(src, [item.pageIndex]);
        out.addPage(copied);
      } else {
        const embedded = await out.embedJpg(item.dataUrl)
          .catch(() => out.embedPng(item.dataUrl));

        const page = out.addPage([item.w, item.h]);
        const maxW = item.w - 40;
        const maxH = item.h - 40;
        const ratio = Math.min(maxW / item.imgW, maxH / item.imgH);
        const dw = item.imgW * ratio;
        const dh = item.imgH * ratio;

        page.drawImage(embedded, {
          x: (item.w - dw) / 2,
          y: (item.h - dh) / 2,
          width: dw,
          height: dh
        });
      }
    }

    const bytes = await out.save();
    const blob = new Blob([bytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = 'NitinStudio-Organized-Pages.pdf';
    a.click();
    URL.revokeObjectURL(url);

    setStatus('✅ PDF save हो गई। NitinStudio!');
  } catch (err) {
    console.error(err);
    setStatus('❌ PDF save करने में समस्या आई।');
  } finally {
    saveBtn.disabled = false;
  }
};
</script>

</body>
</html>
